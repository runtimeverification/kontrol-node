[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontrol-node"
version = "0.1.58"
description = "A local testnet node powered by KEVM"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "pydantic>=2.10.6,<3",
    "kontrol@git+https://github.com/runtimeverification/kontrol.git@v1.0.213",
]

[[project.authors]]
name = "Runtime Verification, Inc."
email = "contact@runtimeverification.com"

[project.scripts]
kontrol-node = "kontrol_node.__main__:main"

[project.entry-points.kdist]
kontrol-node = "kontrol_node.kdist.plugin"

[dependency-groups]
dev = [
    "autoflake",
    "black",
    "flake8",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-quotes",
    "flake8-type-checking",
    "isort",
    "mypy",
    "pep8-naming",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pyupgrade",
    "requests",
    "types-requests",
    "eth-keys",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.isort]
profile = "black"
line_length = 120

[tool.autoflake]
recursive = true
expand-star-imports = true
remove-all-unused-imports = true
ignore-init-module-imports = true
remove-duplicate-keys = true
remove-unused-variables = true

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.mypy]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
