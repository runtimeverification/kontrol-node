name: 'Test'
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here writes to the repository, so the token stays read-only regardless of
# the repository default. Jobs that build the CI image additionally need
# `packages: read` to pull `ghcr.io/foundry-rs/foundry`.
permissions:
  contents: read

jobs:

  code-quality-checks:
    name: 'Code Quality Checks'
    runs-on: [self-hosted, linux, normal]
    permissions:
      contents: read
      packages: read
    env:
      CONTAINER: kontrol-node-code-quality-${{ github.sha }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Set up Docker'
        uses: ./.github/actions/with-docker
        with:
          container-name: ${{ env.CONTAINER }}
      - name: 'Run code quality checks'
        run: docker exec --user user "${CONTAINER}" make check
      - name: 'Run pyupgrade'
        run: docker exec --user user "${CONTAINER}" make pyupgrade
      - name: 'Run unit tests'
        run: docker exec --user user "${CONTAINER}" make test-unit
      - name: 'Tear down Docker'
        if: always()
        run: |
          # Best effort: the container does not exist if 'Set up Docker' failed, and a
          # non-zero exit here would mask the step that actually failed.
          docker stop --timeout=0 "${CONTAINER}" || true

  tests:
    needs: code-quality-checks
    name: 'Tests'
    runs-on: [self-hosted, linux, normal]
    permissions:
      contents: read
      packages: read
    env:
      CONTAINER: kontrol-node-test-${{ github.sha }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Set up Docker'
        uses: ./.github/actions/with-docker
        with:
          container-name: ${{ env.CONTAINER }}
      - name: 'Build kontrol-node'
        run: docker exec --user user "${CONTAINER}" uv run kdist -v build kontrol-node.simbolik
      - name: 'Run tests'
        run: docker exec --user user "${CONTAINER}" make test
      - name: 'Tear down Docker'
        if: always()
        run: |
          # Best effort: the container does not exist if 'Set up Docker' failed, and a
          # non-zero exit here would mask the step that actually failed.
          docker stop --timeout=0 "${CONTAINER}" || true
