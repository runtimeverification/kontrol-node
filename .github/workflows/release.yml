name: Release
on:
  push:
    branches:
      - main

jobs:

  release:
    name: 'Publish Release'
    runs-on: [self-hosted, linux, flyweight]
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.push.head.sha }}
          fetch-depth: 0
      - name: 'Make release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=v$(cat package/version)
          gh release create ${VERSION} --target ${{ github.sha }}

      - name: 'Determine Version'
        id: version
        run: |
          set -x
          # Use version from package/version if it exists, otherwise generate one
          if [ -f package/version ]; then
            VERSION=$(cat package/version | tr -d '[:space:]')
          else
            # Generate date-based version: YYYY.MM.DD
            VERSION=$(date +%Y.%m.%d)
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"
          
      - name: 'Update dependents'
        run: |
            set -x
            VERSION="${{ steps.version.outputs.version }}"
            curl --fail \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.JENKINS_GITHUB_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/runtimeverification/devops/dispatches \
            -d '{"event_type":"on-demand-test","client_payload":{"repo":"runtimeverification/kontrol-node","version":"'${VERSION}'"}}'
